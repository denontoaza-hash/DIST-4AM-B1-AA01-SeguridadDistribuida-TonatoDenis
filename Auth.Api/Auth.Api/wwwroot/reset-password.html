<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - AA01</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 30px;
            color: #333;
        }
        .container {
            max-width: 550px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a73e8;
            font-size: 22px;
            margin-top: 0;
        }
        p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        input[readonly] {
            background-color: #f5f5f5;
            color: #777;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1557b0;
        }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-top: 18px;
            font-size: 14px;
            display: none;
        }
        .alert-success {
            background: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }
        .alert-danger {
            background: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Restablecer Contraseña</h1>
        <p>Ingresa tu nueva contraseña para actualizar las credenciales de tu cuenta.</p>

        <form id="formReset">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" required readonly>
            </div>
            <div class="form-group">
                <label for="token">Token de Recuperación</label>
                <input type="text" id="token" required readonly>
            </div>
            <div class="form-group">
                <label for="nuevaPassword">Nueva Contraseña (mínimo 8 caracteres, mayúscula, minúscula, número y símbolo)</label>
                <input type="password" id="nuevaPassword" required minlength="8" placeholder="Ej: NuevaClave#2026!">
            </div>
            <div class="form-group">
                <label for="confirmarPassword">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmarPassword" required minlength="8" placeholder="Repite la nueva contraseña">
            </div>
            <button type="submit" id="btnSubmit">Actualizar Contraseña</button>
        </form>

        <div id="alertMsg" class="alert"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const emailParam = params.get('email') || '';
        const tokenParam = params.get('token') || '';

        document.getElementById('correo').value = emailParam;
        document.getElementById('token').value = tokenParam;

        const form = document.getElementById('formReset');
        const alertBox = document.getElementById('alertMsg');
        const btn = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const correo = document.getElementById('correo').value.trim();
            const token = document.getElementById('token').value.trim();
            const nuevaPassword = document.getElementById('nuevaPassword').value;
            const confirmarPassword = document.getElementById('confirmarPassword').value;

            if (nuevaPassword !== confirmarPassword) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Las contraseñas no coinciden.';
                alertBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                const res = await fetch('/api/Auth/restablecer-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        correo,
                        token,
                        nuevaPassword,
                        confirmarPassword
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = data.mensaje || 'Contraseña actualizada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.';
                    alertBox.style.display = 'block';
                    form.reset();
                    document.getElementById('correo').value = correo;
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = data.mensaje || 'Error al restablecer la contraseña. El token puede ser inválido o haber expirado.';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Error de conexión: ' + err.message;
                alertBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Actualizar Contraseña';
            }
        });
    </script>
</body>
</html>
